<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Gallery - Fatima Zunaira Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: #f5ead9;
    color: #2a231c;
    line-height: 1.7;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
  }
  .topbar .brand { font-weight: bold; }
  .topbar .nav-links a { color: #2a231c; text-decoration: none; margin-left: 24px; border-bottom: 1px solid transparent; }
  .topbar .nav-links a:hover, .topbar .nav-links a.active { border-bottom: 1px solid #e10600; color: #e10600; }

  .page-title { position: relative; text-align: center; padding: 50px 20px 10px; overflow: hidden; }
  .page-title h1 {
    font-family: Copperplate, Papyrus, fantasy;
    font-size: 44px; color: #1c1c1c; font-weight: normal;
  }
  .page-title .tagline {
    font-family: Copperplate, Papyrus, fantasy;
    color: #e10600; font-size: 16px; margin-top: 10px; letter-spacing: 1px;
  }

  .gallery {
    max-width: 1000px; margin: 30px auto 50px; padding: 0 20px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
  }
  .gallery figure { background: #fff9ef; border: 1px solid #d9c9ac; overflow: hidden; }
  .gallery img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .gallery figcaption {
    padding: 10px; text-align: center; font-size: 13px; color: #1c1c1c;
    border-top: 2px solid #e10600; letter-spacing: 0.5px;
  }
  @media (max-width: 700px) { .gallery { grid-template-columns: repeat(2, 1fr); } }

  .checkered-stripe {
    height: 24px; width: 100%;
    background-image: repeating-conic-gradient(#1c1c1c 0% 25%, #f5ead9 0% 50%);
    background-size: 24px 24px; border-top: 3px solid #e10600; border-bottom: 3px solid #e10600;
  }
  footer { text-align: center; padding: 18px; background: #1c1c1c; color: #ccc; font-size: 12px; letter-spacing: 2px; }
  footer span { color: #e10600; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Fatima Zunaira/ Portfolio</div>
  <div class="nav-links">
    <a href="home.html">Home</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="skills.html">Skills</a>
    <a href="gallery.html" class="active">Gallery</a>
    <a href="contact.html">Contact</a>
  </div>
</div>

<div class="page-title">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <h1>Image Gallery</h1>
  <div class="tagline">Snapshots from the track and beyond</div>
</div>

<div class="gallery">
  <figure><img src="../Images/images (1).jpg" alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">Austrailia</figcaption></figure>
  <figure><img src="../Images/images (2).jpg" alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">China</figcaption></figure>
  <figure><img src="../Images/images (3).jpg" alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">Japan</figcaption></figure>
  <figure><img src="../Images/images (4).jpg " alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">Mexico</figcaption></figure>
  <figure><img src="../Images/images (5).jpg" alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">Qatar</figcaption></figure>
  <figure><img src="../Images/images (6).jpg" alt="Race car"><figcaption style="font-family: Copperplate, Papyrus, fantasy;">Saudi Arab</figcaption></figure>
</div>

<div class="checkered-stripe"></div>
<footer>&copy; 2026 JOHN DOE <span>|</span> ALL RIGHTS RESERVED</footer>

</body>
</html>
